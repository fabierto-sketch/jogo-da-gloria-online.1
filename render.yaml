# Blueprint do Render (Dashboard > New > Blueprint).
# Cria o Web Service gratuito. A base de dados persistente é indicada em
# DATABASE_URL (Neon gratuito recomendado — ver README.md).
services:
  - type: web
    name: jogo-da-gloria-online
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: FORCE_HTTPS
        value: "true"
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
